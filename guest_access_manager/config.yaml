name: "Guest Access Manager"
version: "0.1.17"
slug: "guest_access_manager"
description: "Local guest reservation and Schlage lock access management"
url: "https://github.com/markEdavison/guest-access-manager"
arch:
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: default
ingress: true
ingress_port: 8099
panel_icon: mdi:door-closed-lock
map:
  - type: data
    read_only: false
options:
  admin_username: "houseadmin"
  admin_password: ""
schema:
  admin_username: str
  admin_password: password
